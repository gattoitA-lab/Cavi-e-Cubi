<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Cavi e Cubi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fredoka:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Idea: un quadro elettrico giocoso. Nodi come cubetti con una faccia, cavi colorati, pannelli con bordo spesso e ombra piena. */
:root{
  --bg:#EDEAF8; --dot:#CFC9EA; --panel:#FFFFFF; --panel2:#F4F2FC; --ink:#1B1740; --muted:#5E5A86; --line:#1B1740; --shadow:#1B1740;
  --coral:#FF6B5A; --lemon:#FFD23F; --lemon-ink:#1B1740; --mint:#14C8A0; --blue:#3B82F6; --violet:#8B5CF6;
  --err:#FFE0DC; --warn:#FFF1C4; --info:#DEEAFF; --ok:#D4F6EC;
  --f-d:'Fredoka','Trebuchet MS',system-ui,sans-serif; --f-b:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --f-m:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15112B; --dot:#231D45; --panel:#221C47; --panel2:#181337; --ink:#F1EEFF; --muted:#A7A2D4; --line:#07041A; --shadow:#07041A;
  --err:#4E2233; --warn:#4B3F1B; --info:#1F3563; --ok:#14504A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15112B; --dot:#231D45; --panel:#221C47; --panel2:#181337; --ink:#F1EEFF; --muted:#A7A2D4; --line:#07041A; --shadow:#07041A;
  --err:#4E2233; --warn:#4B3F1B; --info:#1F3563; --ok:#14504A; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:14.5px;line-height:1.45;
  background-image:radial-gradient(var(--dot) 1.5px,transparent 1.6px);background-size:22px 22px;min-height:100%;
  padding-block:8px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-d);margin:0;line-height:1.15;text-wrap:balance}
h2{font-size:16px;font-weight:600;letter-spacing:.01em}
p{margin:0}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.app{max-width:1600px;margin:0 auto}
.spacer{flex:1 1 auto}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding-block:6px 12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-d);font-weight:700;font-size:25px;letter-spacing:.005em}
.tabs{display:flex;gap:6px;overflow-x:auto;max-width:100%;padding:3px 3px 6px;margin-inline:auto 0}
.tab{font-family:var(--f-d);font-weight:600;font-size:16px;padding:5px 15px;border:2.5px solid var(--line);border-radius:999px;background:var(--panel);cursor:pointer;box-shadow:0 3px 0 var(--shadow);white-space:nowrap;transition:transform .1s,background .15s}
.tab:hover{transform:translateY(-1px)}
.tab[aria-selected="true"]{background:var(--lemon);color:var(--lemon-ink)}
.btn{font-family:var(--f-d);font-weight:600;font-size:15px;line-height:1.1;padding:8px 14px;border:2.5px solid var(--line);border-radius:13px;background:var(--panel);color:var(--ink);cursor:pointer;box-shadow:0 3px 0 var(--shadow);transition:transform .08s,box-shadow .08s;touch-action:manipulation;white-space:nowrap}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 0 var(--shadow)}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--blue);color:#fff}.btn.sun{background:var(--lemon);color:var(--lemon-ink)}.btn.danger{background:var(--coral);color:#fff}.btn.mint{background:var(--mint);color:#fff}
.btn.sm{font-size:13px;padding:5px 9px;border-radius:10px}
.btn[aria-pressed="true"]{background:var(--lemon);color:var(--lemon-ink)}
.card{background:var(--panel);border:2.5px solid var(--line);border-radius:18px;box-shadow:0 5px 0 var(--shadow);padding:12px;min-width:0}
.card h2:not(:first-child){margin-top:14px}
.card h2{margin-bottom:8px}
.hint{color:var(--muted);font-size:12.5px;margin-top:8px}
.view{animation:fadeUp .25s ease-out both}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-bottom:10px}
.txt,select.txt,textarea.txt{border:2.5px solid var(--line);border-radius:10px;padding:6px 9px;background:var(--panel2);width:100%;min-width:0}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label,.lbl{font-weight:700;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.row2{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.row2.c2{grid-template-columns:repeat(2,1fr)}
.row2 .field{margin-bottom:4px}
.chk{display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:6px}
.chk input{width:18px;height:18px;accent-color:var(--mint)}
input[type=color]{padding:0;height:34px;border:2.5px solid var(--line);border-radius:10px;background:var(--panel2);width:100%;cursor:pointer}
input[type=range]{accent-color:var(--blue);width:100%}
.seg{display:inline-flex;border:2.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel2)}
.seg button{font-family:var(--f-d);font-weight:600;font-size:14px;border:0;background:transparent;padding:5px 13px;cursor:pointer;border-right:2.5px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--blue);color:#fff}

/* Scena */
.scn{display:grid;grid-template-columns:230px minmax(0,1fr) 290px;gap:14px;align-items:start}
.lib h2{margin-bottom:6px}
.lib .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:6px}
.pal{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px 5px;border:2.5px solid var(--line);border-radius:12px;background:var(--panel2);cursor:pointer;font-size:11.5px;font-weight:700;min-width:0;text-align:center;line-height:1.1;transition:transform .1s}
.pal:hover{transform:translateY(-2px)}
.pal[aria-pressed="true"]{background:var(--lemon);color:var(--lemon-ink);box-shadow:0 3px 0 var(--shadow)}
.pal.locked{opacity:.6;background:repeating-linear-gradient(135deg,var(--panel2) 0 7px,var(--err) 7px 14px)}
.pal.locked::after{content:"x";position:absolute;top:-7px;right:-7px;width:19px;height:19px;border-radius:50%;background:var(--coral);color:#fff;font:700 12px/16px var(--f-d);text-align:center;border:2px solid var(--line)}
.pal.shake{animation:shake .38s}
.pal .ic{width:38px;height:38px;display:grid;place-items:center;font-family:var(--f-d);font-size:16px}
.pal img,.pal canvas{width:38px;height:38px;image-rendering:pixelated;object-fit:contain}
.vpwrap{position:relative;border:2.5px solid var(--line);border-radius:12px;overflow:hidden;background:#cde;aspect-ratio:16/10;max-height:68dvh;width:100%;touch-action:none}
.vpwrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.insp .none{color:var(--muted)}
.insp .brow{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border:2px solid var(--line);border-radius:999px;background:var(--panel2)}
.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.checks li{display:flex;gap:8px;align-items:flex-start;padding:7px 9px;border-radius:10px;border:2px solid var(--line);font-size:13px;animation:pop .25s ease-out both}
.checks li i{flex:none;width:21px;height:21px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font:700 12px/1 var(--f-d);font-style:normal}
.k-error{background:var(--err)}.k-error i{background:var(--coral);color:#fff}.k-warn{background:var(--warn)}.k-warn i{background:var(--lemon);color:var(--lemon-ink)}.k-info{background:var(--info)}.k-info i{background:var(--blue);color:#fff}.k-ok{background:var(--ok)}.k-ok i{background:var(--mint);color:#fff}

/* Nodi */
.nd{display:grid;grid-template-columns:200px minmax(0,1fr);gap:14px;align-items:start}
.ndpal .item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:6px 8px;margin-bottom:6px;border:2.5px solid var(--line);border-radius:11px;background:var(--panel2);cursor:pointer;font-weight:700;font-size:13px}
.ndpal .item:hover{transform:translateX(2px)}
.ndpal .dot{flex:none;width:14px;height:14px;border-radius:5px;border:2px solid var(--line)}
.ndpal h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:10px 0 5px}
.graph{position:relative;height:min(72dvh,640px);border:2.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel2);touch-action:none;cursor:grab}
.graph.pan{cursor:grabbing}
#gWorld{position:absolute;left:0;top:0;transform-origin:0 0;width:3000px;height:2000px}
#gWires{position:absolute;left:0;top:0;width:3000px;height:2000px;pointer-events:none;overflow:visible}
#gWires path{fill:none;stroke-width:4;stroke-linecap:round}
#gWires path.hit{stroke:transparent;stroke-width:16;pointer-events:stroke;cursor:pointer}
#gWires path.sel{stroke-dasharray:2 7}
.node{position:absolute;width:196px;background:var(--panel);border:2.5px solid var(--line);border-radius:14px;box-shadow:0 4px 0 var(--shadow);user-select:none}
.node.sel{outline:3px solid var(--lemon);outline-offset:2px}
.node .hd{display:flex;align-items:center;gap:7px;padding:5px 8px;border-bottom:2.5px solid var(--line);border-radius:11px 11px 0 0;cursor:move;font-family:var(--f-d);font-weight:600;font-size:14px;color:#fff;touch-action:none}
.node .hd span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node .face{flex:none;width:22px;height:18px;background:#fff;border:2px solid var(--line);border-radius:6px;position:relative}
.node .face::before,.node .face::after{content:"";position:absolute;top:5px;width:3px;height:5px;background:var(--line);border-radius:2px}
.node .face::before{left:4px}.node .face::after{right:4px}
.node .hd .x{flex:none;border:0;background:rgba(255,255,255,.25);color:#fff;width:20px;height:20px;border-radius:6px;cursor:pointer;font-weight:700;line-height:1}
.node .body{display:grid;grid-template-columns:1fr 1fr;padding:6px 0}
.port{display:flex;align-items:center;gap:6px;height:22px;font-size:12px;font-weight:700;position:relative}
.port.in{padding-left:12px}.port.out{padding-right:12px;justify-content:flex-end}
.port .pin{position:absolute;top:3px;width:16px;height:16px;border-radius:50%;border:2.5px solid var(--line);background:var(--panel);cursor:crosshair;touch-action:none}
.port.in .pin{left:-9px}.port.out .pin{right:-9px}
.port .pin.on{background:var(--lemon)}
.port .pin:hover,.port .pin.tgt{background:var(--mint);transform:scale(1.25)}
.node .ps{padding:2px 8px 8px;display:flex;flex-direction:column;gap:5px;border-top:2px dashed var(--dot)}
.node .ps label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.node .ps select,.node .ps input[type=text],.node .ps input[type=number]{width:100%;min-width:0;border:2px solid var(--line);border-radius:8px;padding:3px 6px;background:var(--panel2);font-size:13px}
.node .ps input[type=color]{height:26px;border-width:2px;border-radius:8px}
.node .tip{padding:0 8px 6px;font-size:11px;color:var(--muted);line-height:1.25}

/* Disegni */
.drw{display:grid;grid-template-columns:150px minmax(0,1fr) 300px;gap:14px;align-items:start}
.dtools{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.dtools .pal{padding:6px 2px}
.dtools .pal .ic{height:30px;width:100%;font-size:13px}
.dcv{position:relative;display:grid;place-items:center;border:2.5px solid var(--line);border-radius:12px;background:var(--panel2);padding:8px;overflow:auto;max-height:72dvh;touch-action:none}
.dcv .wrap{position:relative;line-height:0;background-color:#fff;background-image:linear-gradient(45deg,#d9d9e6 25%,transparent 25%,transparent 75%,#d9d9e6 75%),linear-gradient(45deg,#d9d9e6 25%,transparent 25%,transparent 75%,#d9d9e6 75%);background-size:16px 16px;background-position:0 0,8px 8px}
.dcv canvas{image-rendering:pixelated;display:block}
.dcv canvas#dOver{position:absolute;inset:0;pointer-events:none}
.pgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-bottom:8px}
.pgrid button{aspect-ratio:1;border:2px solid var(--line);border-radius:6px;cursor:pointer;padding:0}
.pgrid button[aria-pressed="true"]{outline:3px solid var(--lemon);outline-offset:1px}
.frames{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 8px}
.fr{flex:none;width:58px;border:2.5px solid var(--line);border-radius:10px;background:var(--panel2);padding:3px;cursor:pointer;text-align:center;font-size:11px;font-weight:700}
.fr img{width:100%;aspect-ratio:1;object-fit:contain;image-rendering:pixelated;display:block;background:#fff}
.fr[aria-pressed="true"]{background:var(--lemon);color:var(--lemon-ink)}
.gl{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-height:190px;overflow:auto;padding:2px}
.gl button{border:2.5px solid var(--line);border-radius:9px;background:var(--panel2);padding:2px;cursor:pointer}
.gl button[aria-pressed="true"]{outline:3px solid var(--lemon)}
.gl img{width:100%;aspect-ratio:1;object-fit:contain;image-rendering:pixelated;display:block}

/* Modelli */
.mdl{display:grid;grid-template-columns:200px minmax(0,1fr) 290px;gap:14px;align-items:start}
.mlist .it{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:6px 8px;margin-bottom:6px;border:2.5px solid var(--line);border-radius:11px;background:var(--panel2);cursor:pointer;font-weight:700;font-size:13px}
.mlist .it[aria-pressed="true"]{background:var(--lemon);color:var(--lemon-ink)}
.mlist .it small{display:block;color:var(--muted);font-weight:500}
.mlist .it[aria-pressed="true"] small{color:var(--lemon-ink)}
.mprev{position:relative;border:2.5px solid var(--line);border-radius:12px;overflow:hidden;aspect-ratio:4/3;max-height:66dvh;background:#bcd;touch-action:none;width:100%}
.mprev canvas{position:absolute;inset:0;width:100%;height:100%}
.drop{border:3px dashed var(--line);border-radius:14px;padding:12px;text-align:center;color:var(--muted);cursor:pointer;font-weight:600;margin-bottom:8px}
.drop.over{background:var(--ok)}
.parts{display:flex;flex-direction:column;gap:5px;margin-bottom:8px;max-height:150px;overflow:auto}
.parts button{display:flex;align-items:center;gap:8px;text-align:left;padding:5px 8px;border:2.5px solid var(--line);border-radius:10px;background:var(--panel2);cursor:pointer;font-weight:700;font-size:13px}
.parts button[aria-pressed="true"]{background:var(--lemon);color:var(--lemon-ink)}
.parts .sw{flex:none;width:14px;height:14px;border-radius:4px;border:2px solid var(--line)}

/* Gioco e galleria */
.gm{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:14px;align-items:start}
.chips{display:flex;flex-direction:column;gap:6px}
.chip{display:flex;align-items:center;gap:9px;padding:7px 9px;border:2.5px solid var(--line);border-radius:11px;background:var(--panel2);cursor:pointer}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip .box{flex:none;width:21px;height:21px;border:2.5px solid var(--line);border-radius:7px;background:var(--panel);display:grid;place-items:center;font:700 13px/1 var(--f-d);color:transparent}
.chip:has(input:checked){background:var(--ok)}.chip:has(input:checked) .box{background:var(--mint);color:#fff}
.chip:has(input:focus-visible){outline:3px solid var(--blue)}
.chip b{font-family:var(--f-d);font-size:15px;line-height:1.1}.chip small{display:block;color:var(--muted);font-size:11.5px;line-height:1.2}
.tree{font-size:13px;display:flex;flex-direction:column;gap:6px}
.tree .sc{border:2px solid var(--line);border-radius:10px;padding:6px 8px;background:var(--panel2)}
.tree .sc b{font-family:var(--f-d)}
.tree .sc div{color:var(--muted)}
.gal-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:8px}
.gal-head h1{font-size:32px;font-weight:700}
.status{color:var(--muted);min-height:1.3em;margin-bottom:10px}
.gal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:14px}
.gcard{display:flex;flex-direction:column;gap:9px;background:var(--panel);border:2.5px solid var(--line);border-radius:18px;box-shadow:0 5px 0 var(--shadow);padding:10px;min-width:0;animation:fadeUp .3s ease-out both;transition:transform .15s}
.gcard:hover{transform:translateY(-3px) rotate(-.4deg)}
.gcard .th{width:100%;aspect-ratio:16/9;border:2.5px solid var(--line);border-radius:11px;display:block;object-fit:cover;background:var(--panel2)}
.gcard h3{font-size:18px;overflow-wrap:anywhere}
.gmeta{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:11px;font-weight:700;padding:1px 8px;border:2px solid var(--line);border-radius:999px;background:var(--panel2)}
.tag.m2{background:var(--lemon);color:var(--lemon-ink)}.tag.m3{background:var(--violet);color:#fff}.tag.ex{background:var(--mint);color:#fff}
.gauthor{color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.gact{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto}
.empty{grid-column:1/-1;padding:28px 16px;text-align:center;color:var(--muted);border:2.5px dashed var(--line);border-radius:18px}

/* Gioca */
.play-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-bottom:12px}
.play-bar h2{font-size:21px}
.sim{display:flex;align-items:center;gap:8px;font-weight:600}
.devrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.devrow .chip{flex:1 1 170px}.devrow .ver{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);font-weight:600}.devrow .ver input{width:64px}
.cmsg{padding:7px 9px;border:2px solid var(--line);border-radius:10px;margin-bottom:6px;background:var(--info);font-size:13.5px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cmsg.error{background:var(--err)}.cmsg.warn{background:var(--warn)}
.cmsg b{font-family:var(--f-d)}.cmsg .why{flex:1 1 220px}
.issue{border:2.5px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:8px;background:var(--panel2)}.issue .nm{font-family:var(--f-d);font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:3px}.issue p{font-size:13.5px}
.seq{display:block;width:100%;border:2.5px solid var(--line);border-radius:12px;background:var(--panel2);touch-action:none;cursor:pointer}
.srow{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:8px}.srow .field{margin:0;min-width:110px}
.sndmenu .field{margin-bottom:12px}.sndmenu input[type=range]{width:100%}
.stage{position:relative;width:min(100%,calc((100dvh - 230px)*16/9));min-width:min(100%,320px);aspect-ratio:16/9;margin:0 auto;border:2.5px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 5px 0 var(--shadow);background:#8fd3ff;touch-action:none;user-select:none;-webkit-user-select:none}
.stage:fullscreen{width:100%;height:100%;aspect-ratio:auto;border-radius:0;border:0;box-shadow:none}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.gui{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden}
.gui>*{position:absolute;transform:translate(-50%,-50%);pointer-events:none;font-family:var(--f-d);color:#fff;text-shadow:0 2px 0 #1B1740,2px 0 0 #1B1740,-2px 0 0 #1B1740,0 -2px 0 #1B1740;white-space:pre}
.gui .hudtxt{transform:none;font-size:clamp(14px,2.6vw,26px);font-weight:600}
.gui h1{font-size:clamp(22px,5vw,52px);font-weight:700}
.gui p{font-size:clamp(14px,2.6vw,26px);font-weight:500}
.gui button{pointer-events:auto;cursor:pointer;font-size:clamp(14px,2.4vw,24px);font-weight:600;padding:.35em .9em;border:3px solid #1B1740;border-radius:.7em;background:var(--lemon);color:#1B1740;text-shadow:none;box-shadow:0 4px 0 #1B1740}
.gui button:active{transform:translate(-50%,-46%)}

function detectDevice(){
  const ua=navigator.userAgent||'',m=(re)=>{const r=re.exec(ua);return r?r:null};
  if(/Nintendo|Switch/i.test(ua))return{id:'switch',ver:0};
  if(/PlayStation/i.test(ua))return{id:'playstation',ver:0};
  if(/Xbox/i.test(ua))return{id:'xbox',ver:0};
  let r;
  if(/iPhone|iPod/i.test(ua)){r=m(/OS (\d+)[_.]/);return{id:'ios',ver:r?+r[1]:0}}
  if(/iPad/i.test(ua)){r=m(/OS (\d+)[_.]/);return{id:'ipados',ver:r?+r[1]:0}}
  if(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1){r=m(/Version\/(\d+)/);return{id:'ipados',ver:r?+r[1]:0}}
  if(/Android/i.test(ua)){r=m(/Android (\d+)/);return{id:'android',ver:r?+r[1]:0}}
  if(/Windows/i.test(ua)){r=m(/Windows NT (\d+)\.(\d+)/);let v=0;if(r){const a=+r[1],b=+r[2];v=a>=10?10:(a===6&&b===1?7:a===6?8:6)}return{id:'windows',ver:v}}

  return{id:'linux',ver:0};
}

const BEHAVIORS=[['','Nessuno'],['moneta','Moneta: si raccoglie e dà punti'],['pericolo','Pericolo: toglie una vita'],['traguardo','Traguardo: vittoria'],['porta','Porta: cambia scena']];
function applyBehavior(S,a,beh,target){
  const an=actorNode(S,a);let msg='';
  if(beh==='moneta'){
    const cnt=sharedNode(S,'counter','punti',{label:'Punti'},n=>{const t=placeNode(S,'text',{text:'Punti: {v}',x:4,y:10,_k:'punti-t'});addWire(S,n.id,'v',t.id,'v')});
    const snd=sharedNode(S,'sound','s-moneta',{preset:'moneta'});
    addWire(S,an.id,'touch',cnt.id,'up');addWire(S,an.id,'touch',an.id,'kill');addWire(S,an.id,'touch',snd.id,'play');
    msg='Moneta pronta: tocca l\'eroe, sparisce e fa un punto.';
  }else if(beh==='pericolo'){
    const life=sharedNode(S,'life','vite',{},n=>{
      const t=placeNode(S,'text',{text:'Vite: {v}',x:4,y:4,_k:'vite-t'});addWire(S,n.id,'v',t.id,'v');
      const e=sharedNode(S,'end','fine');addWire(S,n.id,'over',e.id,'lose');
    });
    const snd=sharedNode(S,'sound','s-colpo',{preset:'colpo'});
    addWire(S,an.id,'touch',life.id,'lose');addWire(S,an.id,'touch',snd.id,'play');
    msg='Pericolo pronto: toccarlo toglie una vita.';
  }else if(beh==='traguardo'){
    const e=sharedNode(S,'end','fine');const snd=sharedNode(S,'sound','s-vittoria',{preset:'vittoria'});
    addWire(S,an.id,'touch',e.id,'win');addWire(S,an.id,'touch',snd.id,'play');
    msg='Traguardo pronto: toccarlo fa vincere.';
  }else if(beh==='porta'){
    const other=P.scenes.find(s=>s.id!==S.id);
    if(!other)return'Errore: crea prima un\'altra scena a cui collegare la porta.';
    const sc=placeNode(S,'scene',{scene:target||other.id});addWire(S,an.id,'touch',sc.id,'go');
    msg='Porta pronta: toccarla porta a "'+sceneById(sc.p.scene).name+'".';
  }
  a.beh=beh;return msg;
}

function sanitize(p){
  if(!p||typeof p!=='object'||!Array.isArray(p.scenes)||!p.scenes.length)return null;
  const d=newProject();
  p.settings=Object.assign(d.settings,p.settings||{});
  p.sprites=Array.isArray(p.sprites)?p.sprites.filter(s=>s&&Array.isArray(s.anims)&&s.anims.length):[];
  p.models=Array.isArray(p.models)?p.models.filter(m=>m&&m.id):[];
  p.stamps=Array.isArray(p.stamps)?p.stamps:[];
  p.songs=Array.isArray(p.songs)?p.songs.filter(x=>x&&x.id&&(x.kind==='file'?typeof x.data==='string':Array.isArray(x.tr))):[];
  p.sfxs=Array.isArray(p.sfxs)?p.sfxs.filter(x=>x&&x.id&&(x.kind==='file'?typeof x.data==='string':true)):[];
  {const pl=[];(Array.isArray(p.settings.platforms)?p.settings.platforms:[]).forEach(x=>{
    if(x==='web')pl.push('windows','mac','linux');else if(x==='console')pl.push('switch','playstation','xbox');else if(x==='ios')pl.push('ios','ipados');else pl.push(x)});
    p.settings.platforms=Array.from(new Set(pl.filter(x=>DEVICES.some(d=>d.id===x))));
    if(!p.settings.minv||typeof p.settings.minv!=='object')p.settings.minv={};
    if(typeof p.settings.music!=='string')p.settings.music='';}
  p.title=String(p.title||'Gioco senza nome').slice(0,40);
  p.id=String(p.id||uid());
  p.scenes=p.scenes.filter(s=>s&&Array.isArray(s.actors)).map(s=>{
    const b=newScene(String(s.name||'Scena').slice(0,30),s.mode==='3d'?'3d':'2d');
    Object.assign(b,s);b.nodes=Array.isArray(s.nodes)?s.nodes.filter(n=>n&&NT[n.type]):[];if(typeof b.music!=='string')b.music='';
    b.wires=Array.isArray(s.wires)?s.wires:[];b.actors=s.actors.filter(a=>a&&a.kind);
    b.actors=b.actors.map(a=>Object.assign(newActor(a.kind),a));
    const ids=new Set(b.nodes.map(n=>n.id));b.wires=b.wires.filter(w=>ids.has(w.from)&&ids.has(w.to));
    return b;
  });
  if(!p.scenes.length)return null;
  if(!p.scenes.some(s=>s.id===p.start))p.start=p.scenes[0].id;
  return p;
}

/* ---------- Compatibilità ---------- */
function usedKinds(){
  const out={model3d:false,file:false,cursor:P.settings.cursor!=='default'};
  P.scenes.forEach(s=>{s.nodes.forEach(n=>{if(n.type==='cursor')out.cursor=true});
    s.actors.forEach(a=>{if(a.kind==='model'){out.model3d=true;const m=modelById(a.ref);if(m&&m.kind==='file')out.file=true}})});
  return out;
}
function validate(){
  const out=[],E=m=>out.push({level:'error',msg:m}),W=m=>out.push({level:'warn',msg:m}),I=m=>out.push({level:'info',msg:m});
  const S=P.settings;
  if(!S.platforms.length)E('Scegli almeno un posto dove si potrà giocare.');
  if(!S.inputs.length)E('Scegli almeno un modo per controllare il gioco.');
  const k=usedKinds();
  if(k.cursor){
    const t=S.platforms.filter(p=>plClass(p)==='ios'||plClass(p)==='android');
    if(t.length)W('Il cursore personalizzato non si vede su '+joinIt(t.map(pName))+': lì non c\'è il mouse.');
  }
  compatIssues(P).forEach(x=>out.push({level:'error',msg:x.msg,issue:x}));
  const kinds=new Set();P.scenes.forEach(s=>s.nodes.forEach(n=>kinds.add(n.type)));
  const needAny=(types,label,check)=>{
    if(!types.some(t=>kinds.has(t)))return;

  });

      if(a.kind==='sprite'&&!spriteById(a.ref))E(`In "${s.name}" l'oggetto "${a.name}" usa un disegno che non esiste più.`);
      if(a.kind==='model'&&!modelById(a.ref))E(`In "${s.name}" l'oggetto "${a.name}" usa un modello che non esiste più.`);
      if(a.kind==='ui'&&s.mode==='3d'&&false)W('');
    });
    s.nodes.forEach(n=>{
      if(n.type==='scene'&&!sceneById(n.p.scene))E(`In "${s.name}" un nodo Cambia scena punta a una scena che non esiste.`);

  });

}

const AUDIO_BAD_IOS=['ogg','oga','opus','webm'];

const RULES=[
  {key:'3d',bad:(d,v)=>d.cls==='console'?'il 3D del browser delle console non è abbastanza affidabile':(d.id==='ios'||d.id==='ipados')&&v&&v<10?'il 3D (WebGL) serve '+d.short+' 10 o più recente':d.id==='android'&&v&&v<5?'il 3D (WebGL) serve Android 5 o più recente':''},
  {key:'file',bad:(d,v)=>d.cls==='console'?'i modelli 3D importati non funzionano sul browser delle console':(d.id==='ios'||d.id==='ipados')&&v&&v<11?'i modelli 3D importati servono '+d.short+' 11 o più recente':d.id==='android'&&v&&v<6?'i modelli 3D importati servono Android 6 o più recente':''},
  {key:'cursor',bad:(d)=>d.cls==='console'?'il cursore del mouse non c\'è sulle console':''},
  {key:'oggg',bad:(d)=>d.cls==='ios'?'iPhone e iPad non leggono questo formato audio: usa MP3 o WAV':''},
  {key:'flac',bad:(d,v)=>(d.id==='ios'||d.id==='ipados')&&v&&v<11?'il formato FLAC serve '+d.short+' 11 o più recente':''}
];
function compatIssues(p,devs){
  devs=devs||p.settings.platforms.map(id=>({id,ver:Number((p.settings.minv||{})[id])||(devOf(id).def||0)}));
  const items=[];
  const add=(rule,item)=>items.push({rule,item});
  p.scenes.forEach(sc=>{
    if(sc.mode==='3d')add('3d',{name:'Scena 3D "'+sc.name+'"',kind:'scene',scene:sc.id});
    sc.actors.forEach(a=>{if(a.kind==='model'){const m=p.models.find(x=>x.id===a.ref);if(m&&m.kind==='file')add('file',{name:a.name,kind:'actor',scene:sc.id,id:a.id})}});
    sc.nodes.forEach(n=>{if(n.type==='cursor')add('cursor',{name:'Nodo Cursore ('+sc.name+')',kind:'node',scene:sc.id,id:n.id})});
  });
  if(p.settings.cursor&&p.settings.cursor!=='default')add('cursor',{name:'Cursore del mouse del gioco',kind:'game'});
  [['song',p.songs||[]],['sfx',p.sfxs||[]]].forEach(g=>g[1].forEach(x=>{
    if(x.kind!=='file')return;const e=audioExt(x);
    if(AUDIO_BAD_IOS.includes(e))add('oggg',{name:(g[0]==='song'?'Canzone ':'Effetto ')+'"'+x.name+'" (.'+e+')',kind:g[0],id:x.id});
    if(e==='flac')add('flac',{name:(g[0]==='song'?'Canzone ':'Effetto ')+'"'+x.name+'" (.flac)',kind:g[0],id:x.id});
  }));
  const out=[];
  items.forEach(it=>{
    const rule=RULES.find(r=>r.key===it.rule),by=new Map();
    devs.forEach(d=>{const dv=devOf(d.id),why=rule.bad(dv,d.ver);if(why){if(!by.has(why))by.set(why,[]);by.get(why).push(devLabel(d.id,d.ver))}});
    if(!by.size)return;
    const parts=[];by.forEach((labs,why)=>parts.push(joinIt(labs)+' ('+why+')'));
    const text='Questo oggetto non va bene per '+parts.join('; ')+'.';
    out.push({name:it.item.name,ref:it.item,text,msg:it.item.name+': '+text,devs:Array.from(by.values()).flat()});
  });
  return out;
}

const GEO={};
function geoFor(shape){
  if(GEO[shape])return GEO[shape];
  const T=THREE;let g;
  if(shape==='sphere')g=new T.SphereGeometry(.5,20,14);
  else if(shape==='cyl')g=new T.CylinderGeometry(.5,.5,1,20);
  else if(shape==='cone')g=new T.ConeGeometry(.5,1,20);
  else if(shape==='torus')g=new T.TorusGeometry(.34,.14,12,24);
  else if(shape==='plane'){g=new T.BoxGeometry(1,.06,1)}
  else g=new T.BoxGeometry(1,1,1);
  return GEO[shape]=g;
}
const TEXC=new Map(),MATC=new Map();
function texFor(url){
  if(TEXC.has(url))return TEXC.get(url);
  const im=img(url),t=new THREE.Texture(im);t.magFilter=THREE.NearestFilter;t.minFilter=THREE.NearestFilter;
  if(im.complete&&im.naturalWidth)t.needsUpdate=true;else im.addEventListener('load',()=>{t.needsUpdate=true});
  TEXC.set(url,t);return t;
}

function matFor(color,texId){

  if(MATC.has(k))return MATC.get(k);
  const m=new THREE.MeshLambertMaterial({color:new THREE.Color(url?'#ffffff':color)});
  if(url){m.map=texFor(url)}
  MATC.set(k,m);return m;
}
function partMesh(p){
  const m=new THREE.Mesh(geoFor(p.shape),matFor(p.color,p.tex));
  m.scale.set(p.sx,p.sy,p.sz);m.position.set(p.x,p.y,p.z);m.rotation.y=(p.ry||0)*Math.PI/180;return m;
}

function normalizeObj(obj){
  const T=THREE,box=new T.Box3().setFromObject(obj),size=new T.Vector3(),c=new T.Vector3();
  if(box.isEmpty()){size.set(1,1,1);c.set(0,.5,0);box.min.set(-.5,0,-.5)}else{box.getSize(size);box.getCenter(c)}
  const k=1/Math.max(size.x,size.y,size.z,1e-6),w=new T.Group(),inner=new T.Group();
  inner.add(obj);obj.position.sub(new T.Vector3(c.x,box.min.y,c.z));
  w.add(inner);inner.scale.setScalar(k);
  w.userData.size={x:Math.max(.001,size.x*k),y:Math.max(.001,size.y*k),z:Math.max(.001,size.z*k)};return w;
}

function extOf(n){const i=String(n).lastIndexOf('.');return i<0?'':n.slice(i+1).toLowerCase()}
function grayMat(){return new THREE.MeshLambertMaterial({color:0xcfd3e6,side:THREE.DoubleSide})}
function loadModelObj(m){
  if(MOBJ.has(m.id))return MOBJ.get(m.id);
  const pr=new Promise((res,rej)=>{
    try{
      if(!threeOK())throw new Error('Il motore 3D non è disponibile su questo dispositivo.');
      if(m.kind!=='file'){const o=normalizeObj(buildPartsRaw(m));res(o);return}
      const buf=b642ab(m.b64),T=THREE,ext=m.ext,need=(n)=>{if(!T[n])throw new Error('Il lettore del formato '+(MFORMATS[ext]||ext)+' non si è caricato. Controlla la connessione e riprova.')};
      const text=()=>new TextDecoder().decode(buf),done=o=>{
        o.traverse(c=>{if(c.isMesh){if(!c.material||Array.isArray(c.material)&&!c.material.length)c.material=grayMat();c.frustumCulled=false}});
        res(normalizeObj(o));
      };
      if(ext==='glb'||ext==='gltf'){need('GLTFLoader');new T.GLTFLoader().parse(ext==='glb'?buf:text(),'',g=>done(g.scene),e=>rej(new Error('Il file glTF non si apre'+(ext==='gltf'?': se usa file esterni (immagini o .bin) non possono essere letti. Esportalo come .glb.':'.'))))}
      else if(ext==='obj'){need('OBJLoader');const o=new T.OBJLoader().parse(text());o.traverse(c=>{if(c.isMesh)c.material=grayMat()});done(o)}
      else if(ext==='stl'){need('STLLoader');const g=new T.STLLoader().parse(buf);done(new T.Mesh(g,grayMat()))}
      else if(ext==='ply'){need('PLYLoader');const g=new T.PLYLoader().parse(buf);g.computeVertexNormals();const mt=grayMat();if(g.attributes.color)mt.vertexColors=true;done(new T.Mesh(g,mt))}
      else if(ext==='dae'){need('ColladaLoader');done(new T.ColladaLoader().parse(text(),'').scene)}
      else if(ext==='fbx'){need('FBXLoader');done(new T.FBXLoader().parse(buf,''))}
      else throw new Error('Formato non supportato.');
    }catch(e){rej(e)}
  });
  MOBJ.set(m.id,pr);pr.then(o=>MSIZE.set(m.id,o.userData.size),()=>{MOBJ.delete(m.id)});
  return pr;
}
function modelSize(m){return MSIZE.get(m.id)||{x:1,y:1,z:1}}
function newPartsModel(name){
  return{id:uid(),name,kind:'parts',parts:[
    {shape:'box',x:0,y:.55,z:0,sx:.8,sy:.9,sz:.6,ry:0,color:'#FF6B5A',tex:''},
    {shape:'sphere',x:0,y:1.3,z:0,sx:.7,sy:.7,sz:.7,ry:0,color:'#FFD23F',tex:''},
    {shape:'cyl',x:-.3,y:.1,z:0,sx:.22,sy:.2,sz:.22,ry:0,color:'#1B1740',tex:''},
    {shape:'cyl',x:.3,y:.1,z:0,sx:.22,sy:.2,sz:.22,ry:0,color:'#1B1740',tex:''}]};
}
async function importModelFile(file){
  const ext=extOf(file.name);
  if(!MFORMATS[ext]){
    const why=MUNSUP[ext]||'è un formato che non riconosco.';
    dialog({title:'Formato non supportato',text:'Il file "'+file.name+'" ('+(ext?'.'+ext:'senza estensione')+') non si può importare: '+why,list:['Formati supportati: '+Object.keys(MFORMATS).map(k=>'.'+k).join(', ')+'.']});
    return;
  }
  if(!threeOK()){toast('Errore: il motore 3D non è disponibile qui, quindi non posso leggere il modello.','err');return}
  if(file.size>25*1024*1024){toast('Errore: il file pesa '+(file.size/1048576).toFixed(1)+' MB e il massimo è 25 MB.','err');return}
  const buf=await file.arrayBuffer();
  const m={id:uid(),name:uniqueName(P.models,file.name.replace(/\.[^.]+$/,'').slice(0,28)||'Modello'),kind:'file',ext,fname:file.name,b64:ab2b64(buf)};
  try{
    await loadModelObj(m);
  }catch(e){MOBJ.delete(m.id);dialog({title:'Non riesco ad aprire il modello',text:'"'+file.name+'": '+(e&&e.message||'il file è rovinato o incompleto.')});return}
  P.models.push(m);MD.id=m.id;save();renderModels();
  toast('Modello importato.'+(file.size>2*1024*1024?' Pesa molto: non entra nella galleria online, ma puoi esportare il progetto.':''),'ok');
}

    const T=THREE,r=new T.WebGLRenderer({canvas:cvM,antialias:true}),sc=new T.Scene(),cam=new T.PerspectiveCamera(45,4/3,.1,200);

    MR={ok:true,r,sc,cam,holder,yaw:.7,pitch:.35,dist:4.2,ty:.8};

    twoFinger(cvM,{snapshot:()=>({dist:MR.dist}),onStart:()=>{dr=null},onMove:({scale,start})=>{MR.dist=clamp(start.dist/scale,1.5,20)}});
    if(window.ResizeObserver)new ResizeObserver(()=>{const w=cvM.clientWidth,h=cvM.clientHeight;if(w&&h){r.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}}).observe($('#mPrev'));

function frameURL(sp,animName,tt){

function shade(hex,t){return mixHex(hex,t>0?'#ffffff':'#000000',Math.abs(t))}

function bg2D(c,cw,ch,cx,t,bg){
  const gr=c.createLinearGradient(0,0,0,ch);gr.addColorStop(0,bg[0]);gr.addColorStop(1,bg[1]);c.fillStyle=gr;c.fillRect(0,0,cw,ch);
  c.fillStyle='rgba(255,255,255,.5)';
  for(let i=0;i<6;i++){const w=cw+300,x=(((i*230-cx*14+t*8)%w)+w)%w-150,y=ch*(.1+((i*37)%5)*.1);c.beginPath();c.ellipse(x,y,54,17,0,0,6.3);c.ellipse(x+34,y+5,40,13,0,0,6.3);c.ellipse(x-30,y+6,36,12,0,0,6.3);c.fill()}
}

/* it: {a,x,y,w,h,face,url,alpha} ; L,T,W,H = rettangolo sullo schermo ; S = pixel per unità */
function drawActor2D(c,it,L,T,W,H,S,t,edit){
  const a=it.a;c.save();c.globalAlpha=it.alpha==null?1:it.alpha;
  if(a.rot){c.translate(L+W/2,T+H/2);c.rotate(-a.rot*Math.PI/180);c.translate(-(L+W/2),-(T+H/2))}
  c.lineWidth=Math.max(1.5,S*.07);c.strokeStyle=INK;c.lineJoin='round';

const COARSE=(window.matchMedia&&matchMedia('(pointer:coarse)').matches)||('ontouchstart' in window);
function twoFinger(el,cfg){
  const pts=new Map();let g=null;
  const arr=()=>Array.from(pts.values());
  el.addEventListener('pointerdown',e=>{
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===2){if(cfg.onStart)cfg.onStart();const p=arr();
      g=Object.assign({},cfg.snapshot(),{d0:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)||1,mx0:(p[0].x+p[1].x)/2,my0:(p[0].y+p[1].y)/2})}
  });
  el.addEventListener('pointermove',e=>{
    if(!pts.has(e.pointerId))return;
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size<2||!g)return;
    const p=arr(),d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)||1;
    cfg.onMove({scale:d/g.d0,mx:(p[0].x+p[1].x)/2,my:(p[0].y+p[1].y)/2,start:g});
  });
  const end=e=>{if(!pts.has(e.pointerId))return;pts.delete(e.pointerId);if(pts.size<2)g=null};
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
}

/* ----- interazione: 2D ----- */
function hit2(wx,wy){
  const S=curScene();
  for(let i=S.actors.length-1;i>=0;i--){const a=S.actors[i];if(a.kind==='ui'||a.kind==='model')continue;
    if(wx>=a.x-a.w/2&&wx<=a.x+a.w/2&&wy>=a.y&&wy<=a.y+a.h)return a}
  return null;
}
function pdown2(e){
  if(!e.isPrimary)return;const r=cvS2.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top,{wx,wy}=s2w(px,py),S=curScene();
  cvS2.setPointerCapture(e.pointerId);
  const pan=e.button===1||e.button===2||UI.tool==='hand'||SE.space;
  if(pan){SE.drag={m:'pan',px,py,cx:SE.cam.x,cy:SE.cam.y};return}
  // interfaccia
  for(let i=S.actors.length-1;i>=0;i--){const a=S.actors[i];if(a.kind==='ui'&&a._px!=null&&Math.abs(px-a._px)<34&&Math.abs(py-a._py)<11){UI.sel=a.id;renderInsp();pushHist(S);SE.drag={m:'ui',a};return}}
  const sel=selActor();
  if(sel&&sel.kind!=='ui'){const z=SE.cam.z,hx=(sel.x+sel.w/2-SE.cam.x)*z+SE.cw/2,hy=SE.ch/2-(sel.y-SE.cam.y)*z;if(Math.abs(px-hx)<10&&Math.abs(py-hy)<10){pushHist(S);SE.drag={m:'size',a:sel};return}}
  if(UI.tool==='erase'){const a=hit2(wx,wy);if(a){UI.sel=a.id;deleteSel()}return}
  if(SE.place&&UI.tool==='place'){
    pushHist(S);const p=snapPos2(wx,wy);const ex=S.actors.find(a=>a.kind!=='zone'&&a.kind!=='ui'&&Math.abs(a.x-p.x)<.01&&Math.abs(a.y-p.y)<.01&&SE.place.kind!=='zone');
    if(!ex){doPlace(p.x,p.y,0,SE.place)}SE.drag={m:'paint',last:p.x+','+p.y};renderInsp();return;
  }
  const a=hit2(wx,wy);
  if(a){UI.sel=a.id;pushHist(S);SE.drag={m:'move',a,wx,wy,ax:a.x,ay:a.y};renderInsp()}
  else{UI.sel=null;renderInsp()}
}
function pmove2(e){
  const r=cvS2.getBoundingClientRect(),px=e.clientX-r.left,py=e.clientY-r.top,{wx,wy}=s2w(px,py);SE.hover={wx,wy,px,py};const d=SE.drag;if(!d)return;
  if(d.m==='pan'){SE.cam.x=d.cx-(px-d.px)/SE.cam.z;SE.cam.y=d.cy+(py-d.py)/SE.cam.z}
  else if(d.m==='move'){const g=UI.snap;const dx=wx-d.wx,dy=wy-d.wy;d.a.x=r2(g?d.ax+Math.round(dx/g)*g:d.ax+dx);d.a.y=r2(g?d.ay+Math.round(dy/g)*g:d.ay+dy);d.moved=true;sceneDirty();syncInspPos()}
  else if(d.m==='size'){const a=d.a,g=UI.snap||.25;a.w=r2(Math.max(.25,Math.round((wx-(a.x-a.w/2))/g)*g||g));a.h=r2(Math.max(.25,Math.round((a.y+a.h-wy)/g)*g||g));a.y=r2(a.y);sceneDirty();syncInspPos()}
  else if(d.m==='ui'){d.a.ux=clamp(Math.round(px/SE.cw*100),0,100);d.a.uy=clamp(Math.round(py/SE.ch*100),0,100);sceneDirty();syncInspPos()}
  else if(d.m==='paint'&&SE.place&&SE.place.kind!=='zone'&&SE.place.kind!=='text'&&SE.place.kind!=='ui'){
    const p=snapPos2(wx,wy),k=p.x+','+p.y;if(k===d.last)return;d.last=k;const S=curScene();
    if(!S.actors.some(a=>a.kind!=='zone'&&Math.abs(a.x-p.x)<.01&&Math.abs(a.y-p.y)<.01))doPlace(p.x,p.y,0,SE.place);
  }
}
function pup2(){SE.drag=null}

function pdown3(e){

  const orbit=e.button===2||e.button===1||UI.tool==='hand';
  if(orbit){SE.drag={m:'orbit',x:e.clientX,y:e.clientY};return}
  if(UI.tool==='erase'){const h=pick3(e.clientX,e.clientY);if(h){UI.sel=h.id;deleteSel()}return}

function pmove3(e){

  else if(d.m==='move'){
    const a=d.a;
    if(e.shiftKey){a.y=r2(Math.max(-5,d.ay+(d.cy-e.clientY)*.03));if(UI.snap)a.y=Math.round(a.y/UI.snap)*UI.snap}
    else{const v=ground3(e.clientX,e.clientY,d.ay);if(v&&d.v0){const g=UI.snap;const dx=v.x-d.v0.x,dz=v.z-d.v0.z;a.x=r2(g?d.ax+Math.round(dx/g)*g:d.ax+dx);a.z=r2(g?d.az+Math.round(dz/g)*g:d.az+dz)}}
    const o=E3.map.get(a.id);if(o)o.position.set(a.x,a.y,a.z);syncInspPos();save();
  }
}

/* ---------- ingressi ---------- */
const BTNKEYS={A:['Space','KeyZ'],B:['KeyX'],X:['KeyC'],Y:['KeyV']},BTNPAD={A:0,B:1,X:2,Y:3};
function getPad(){try{const p=navigator.getGamepads?navigator.getGamepads():[];for(let i=0;i<p.length;i++)if(p[i]&&p[i].connected)return p[i]}catch(e){}return null}
function stickVal(){
  let x=0,y=0;const I=RN.inputs,m3=!RN.R.m2;
  if(I.has('keyboard')){const k=RN.keys;
    if(k.has('ArrowLeft')||k.has('KeyA'))x-=1;if(k.has('ArrowRight')||k.has('KeyD'))x+=1;if(k.has('ArrowUp')||k.has('KeyW'))y+=1;if(k.has('ArrowDown')||k.has('KeyS'))y-=1;
    if(m3){if(k.has('KeyQ'))RN.yaw-=.03;if(k.has('KeyE'))RN.yaw+=.03}}
  if(I.has('touch')){const jx=Math.abs(RN.joy.x)<.2?0:RN.joy.x,jy=Math.abs(RN.joy.y)<.2?0:RN.joy.y;x+=jx;y+=jy}
  if(I.has('gamepad')){const g=getPad();if(g){const dz=v=>Math.abs(v)<.22?0:v;x+=dz(g.axes[0]||0);y+=-dz(g.axes[1]||0);
    if(g.buttons[14]&&g.buttons[14].pressed)x-=1;if(g.buttons[15]&&g.buttons[15].pressed)x+=1;if(g.buttons[12]&&g.buttons[12].pressed)y+=1;if(g.buttons[13]&&g.buttons[13].pressed)y-=1;
    if(m3)RN.yaw+=dz(g.axes[2]||0)*.04}}

}
function btnVal(b){
  const I=RN.inputs;
  if(I.has('keyboard')&&BTNKEYS[b].some(k=>RN.keys.has(k)))return 1;
  if(I.has('touch')&&RN.tbtn[b])return 1;

}
function keyMatch(param){
  const p=String(param||'').trim();if(!p)return false;const k=RN.keys;
  if(p.length===1){const u=p.toUpperCase();return k.has('Key'+u)||k.has('Digit'+p)}
  const n=p.toLowerCase();return k.has(p)||(n==='spazio'&&k.has('Space'))||(n==='invio'&&k.has('Enter'));
}

/* ---------- fisica ---------- */
const colBox=r=>({x0:r.x-r.cw/2,x1:r.x+r.cw/2,y0:r.y,y1:r.y+r.ch,z0:r.z-r.cd/2,z1:r.z+r.cd/2});
function overlapAny(R,r){
  const b=colBox(r),e=1e-5;
  for(let i=0;i<R.solids.length;i++){const s=R.solids[i];if(s===r||!s.alive)continue;
    const sx0=s.x-s.cw/2,sx1=s.x+s.cw/2,sy0=s.y,sy1=s.y+s.ch;
    if(b.x0<sx1-e&&b.x1>sx0+e&&b.y0<sy1-e&&b.y1>sy0+e&&(R.m2||(b.z0<s.z+s.cd/2-e&&b.z1>s.z-s.cd/2+e)))return s}
  return null;
}
function moveBox(R,r,dx,dy,dz){
  let s,n;
  if(dx){r.x+=dx;n=0;while((s=overlapAny(R,r))&&n++<4){r.x=dx>0?s.x-s.cw/2-r.cw/2-1e-4:s.x+s.cw/2+r.cw/2+1e-4;r.vx=0}}
  if(dz&&!R.m2){r.z+=dz;n=0;while((s=overlapAny(R,r))&&n++<4){r.z=dz>0?s.z-s.cd/2-r.cd/2-1e-4:s.z+s.cd/2+r.cd/2+1e-4;r.vz=0}}
  r.ground=false;
  if(dy){r.y+=dy;n=0;while((s=overlapAny(R,r))&&n++<4){if(dy>0){r.y=s.y-r.ch-1e-4}else{r.y=s.y+s.ch+1e-4;r.ground=true}r.vy=0}}
}
function physics(R,r,dt){
  const a=r.a,st=P.settings,m2=R.m2,speed=st.speed;
  r.t+=dt;
  const cx=clamp(r.cmdx,-1,1),cy=clamp(r.cmdy,-1,1);
  if(a.body==='fisso'){
    if(cx||cy){const k=speed*dt;r.x+=cx*k;if(m2)r.y+=cy*k;else r.z-=cy*k;if(cx)r.face=m2?(cx>0?1:-1):Math.atan2(cx,-cy)}
    r.cmdx=r.cmdy=0;r.jumpReq=false;return;
  }
  let tx=0,tz=0;
  if(m2)tx=cx*speed;
  else if(a.player){const yw=RN.yaw,fx=-Math.sin(yw),fz=-Math.cos(yw),rx=Math.cos(yw),rz=-Math.sin(yw);tx=(fx*cy+rx*cx)*speed;tz=(fz*cy+rz*cx)*speed}
  else{tx=cx*speed;tz=-cy*speed}
  const k=Math.min(1,(r.ground?16:8)*dt);r.vx+=(tx-r.vx)*k;if(!m2)r.vz+=(tz-r.vz)*k;
  if(a.body==='fisica'){
    r.coy=r.ground?.1:r.coy-dt;r.jbuf=r.jumpReq?.12:r.jbuf-dt;
    if(r.jbuf>0&&r.coy>0){r.vy=st.jump;r.jbuf=0;r.coy=0;r.ground=false;if(a.player)sfx('salto');puff(r.x,r.y,r.z,'#ffffff',5)}
    if(!r.jumpHeld&&r.vy>0)r.vy-=55*dt;
    r.vy=Math.max(-28,r.vy-st.gravity*dt);
  }else{r.vy=m2?cy*speed:0}
  if(m2){if(Math.abs(r.vx)>.4)r.face=r.vx>0?1:-1}else if(Math.hypot(r.vx,r.vz)>.6)r.face=Math.atan2(r.vx,r.vz);
  const was=r.ground,vb=r.vy;moveBox(R,r,r.vx*dt,r.vy*dt,m2?0:r.vz*dt);
  if(m2)r.z=0;if(!was&&r.ground&&vb<-6)puff(r.x,r.y,r.z,'#ffffff',4);
  r.cmdx=r.cmdy=0;r.jumpReq=false;
}
function puff(x,y,z,col,n){for(let i=0;i<n;i++){if(RN.parts.length>140)RN.parts.shift();RN.parts.push({x,y,z,vx:(Math.random()-.5)*5,vy:Math.random()*5+1,vz:(Math.random()-.5)*5,l:.5+Math.random()*.4,c:col})}}
function overlapActors(R,a,b,pad){
  const e=pad||0;
  const ax0=a.x-a.cw/2-e,ax1=a.x+a.cw/2+e,ay0=a.y-e,ay1=a.y+a.ch+e,bx0=b.x-b.w/2,bx1=b.x+b.w/2,by0=b.y,by1=b.y+b.h;
  if(!(ax0<bx1&&ax1>bx0&&ay0<by1&&ay1>by0))return false;
  return R.m2||(a.z-a.cd/2-e<b.z+b.d/2&&a.z+a.cd/2+e>b.z-b.d/2);
}

/* ---------- grafo dei nodi ---------- */
function Iv(R,n,port){const ws=R.wi[n.id]&&R.wi[n.id][port];let s=0;if(ws)for(let i=0;i<ws.length;i++){const o=R.nv[ws[i].from];if(o&&o[ws[i].fo]!=null)s+=o[ws[i].fo]}return s}
function wired(R,n,port){return!!(R.wi[n.id]&&R.wi[n.id][port]&&R.wi[n.id][port].length)}
function edge(R,n,port,v){const k=n.id+':'+port,p=R.prev[k]||0;R.prev[k]=v;return v>0&&p<=0}
function evalGraph(R,dt){
  const S=R.S;R.actors.forEach(r=>{r.cmdx=0;r.cmdy=0;r.jumpHeld=false});
  const st=stickVal();
  for(let i=0;i<R.order.length;i++){
    const n=R.order[i],p=n.p;let o={};
    switch(n.type){
      case'stick':o={x:st.x,y:st.y};break;
      case'button':{const v=btnVal(p.btn),pv=R.prev[n.id+':b']||0;R.prev[n.id+':b']=v;o={on:v,hit:v&&!pv?1:0};break}
      case'key':{const v=keyMatch(p.key)?1:0,pv=R.prev[n.id+':k']||0;R.prev[n.id+':k']=v;o={on:v,hit:v&&!pv?1:0};break}
      case'mouse':o={x:RN.mouse.x,y:RN.mouse.y,on:RN.mouse.on?1:0,hit:RN.mouse.hit?1:0};break;
      case'actor':{
        const r=R.byId[p.actor];if(!r){o={};break}
        r.cmdx+=Iv(R,n,'mx');r.cmdy+=Iv(R,n,'my');
        const j=Iv(R,n,'jump');if(j>0)r.jumpHeld=true;if(edge(R,n,'jump',j))r.jumpReq=true;
        if(edge(R,n,'kill',Iv(R,n,'kill'))){r.alive=false;r.visible=false}
        if(wired(R,n,'show')){r.visible=Iv(R,n,'show')>0}
        if(wired(R,n,'val'))r.val=Iv(R,n,'val');
        o={x:r.x,y:r.y,touch:r.alive?r.touch:0,ground:r.ground?1:0,click:r.clickPulse};break}
      case'spawner':{
        const r=R.byId[p.actor];
        if(r&&edge(R,n,'fire',Iv(R,n,'fire'))&&r.alive){
          const sp=num(p.speed,12);let vx=0,vy=0,vz=0;
          if(p.dir==='su')vy=sp;else if(p.dir==='giù')vy=-sp;else if(R.m2)vx=sp*(r.face<0?-1:1);else{vx=Math.sin(r.face)*sp;vz=Math.cos(r.face)*sp}
          R.proj.push({x:r.x+(R.m2?(r.face<0?-1:1)*(r.cw/2+.3):Math.sin(r.face)*(r.cw/2+.4)),y:r.y+r.ch*.55,z:r.z+(R.m2?0:Math.cos(r.face)*(r.cw/2+.4)),vx,vy,vz,life:3,color:p.color||'#FFD23F',node:n.id,from:r});sfx('laser');
        }
        o={hit:R.hits[n.id]?1:0};break}
      case'counter':{
        const key=p.label||n.id;if(RN.vars[key]==null)RN.vars[key]=num(p.start);
        if(edge(R,n,'up',Iv(R,n,'up')))RN.vars[key]++;if(edge(R,n,'down',Iv(R,n,'down')))RN.vars[key]--;if(edge(R,n,'reset',Iv(R,n,'reset')))RN.vars[key]=num(p.start);
        o={v:RN.vars[key]};break}
      case'timer':{
        const t=R.tm[n.id];let done=0;if(edge(R,n,'start',Iv(R,n,'start'))){t.run=true;t.t=0}
        if(t.run){t.t+=dt;if(t.t>=num(p.sec,1)){done=1;if(p.loop)t.t=0;else{t.run=false;t.t=num(p.sec,1)}}}
        o={done,t:t.t};break}
      case'random':{if(edge(R,n,'go',Iv(R,n,'go')))R.rnd[n.id]=num(p.min)+Math.random()*(num(p.max)-num(p.min));o={v:R.rnd[n.id]};break}
      case'const':o={v:num(p.v)};break;
      case'not':o={v:Iv(R,n,'a')>0?0:1};break;
      case'and':o={v:Iv(R,n,'a')>0&&Iv(R,n,'b')>0?1:0};break;
      case'or':o={v:Iv(R,n,'a')>0||Iv(R,n,'b')>0?1:0};break;
      case'compare':{const a=Iv(R,n,'a'),b=Iv(R,n,'b'),op=p.op;o={v:(op==='>'?a>b:op==='<'?a<b:op==='='?Math.abs(a-b)<1e-6:op==='>='?a>=b:op==='<='?a<=b:Math.abs(a-b)>=1e-6)?1:0};break}
      case'math':{const a=Iv(R,n,'a'),b=Iv(R,n,'b'),op=p.op;o={v:op==='+'?a+b:op==='-'?a-b:op==='×'?a*b:op==='÷'?(b?a/b:0):op==='min'?Math.min(a,b):Math.max(a,b)};break}
      case'life':{
        if(edge(R,n,'lose',Iv(R,n,'lose'))&&R.invuln<=0&&RN.state==='play'){RN.lives--;R.invuln=.9;RN.shake=.3;const h=R.hero;if(h)puff(h.x,h.y+.5,h.z,'#FF6B5A',12);if(RN.lives<=0)loseGame()}
        if(edge(R,n,'gain',Iv(R,n,'gain')))RN.lives=Math.min(9,RN.lives+1);
        o={v:RN.lives,over:RN.lives<=0?1:0};break}
      case'sound':if(edge(R,n,'play',Iv(R,n,'play')))sfx(p.preset);break;
      case'music':if(edge(R,n,'play',Iv(R,n,'play')))gmSong(p.track,p.loop!==false);if(edge(R,n,'stop',Iv(R,n,'stop')))gmStopSong();break;
      case'scene':if(edge(R,n,'go',Iv(R,n,'go'))&&sceneById(p.scene))R.goto=p.scene;break;
      case'cursor':if(edge(R,n,'set',Iv(R,n,'set'))){RN.cursorSet=true;applyCursor(p.cursor)}break;
      case'end':{if(edge(R,n,'win',Iv(R,n,'win')))winGame();if(edge(R,n,'lose',Iv(R,n,'lose')))loseGame();break}
      case'text':{

          const t=String(p.text||'').replace('{v}',wired(R,n,'v')?val:'');if(e.textContent!==t)e.textContent=t;e.style.display=vis?'':'none'}

    }

  }

}

/* ---------- passo di gioco ---------- */
function step(dt){
  const R=RN.R,m2=R.m2;RN.time+=dt;R.t+=dt;R.invuln=Math.max(0,R.invuln-dt);RN.shake=Math.max(0,RN.shake-dt);
  evalGraph(R,dt);
  R.actors.forEach(r=>{
    if(!r.alive)return;
    const a=r.a;
    if(a.kind==='ui'||a.kind==='text'||a.kind==='zone'&&a.body==='fisso'&&!r.cmdx&&!r.cmdy){r.cmdx=r.cmdy=0;r.jumpReq=false;return}
    physics(R,r,dt);
  });
  const h=R.hero;
  if(h&&h.alive&&h.y<-15){RN.lives--;RN.shake=.3;if(RN.lives<=0){loseGame()}else{h.x=R.spawn.x;h.y=R.spawn.y+.01;h.z=R.spawn.z;h.vx=h.vy=h.vz=0}}
  // contatti con l'eroe e clic
  R.actors.forEach(r=>{
    if(r===h||!r.alive||!h||!h.alive||r.a.kind==='ui'){r.touch=0;return}
    r.touch=overlapActors(R,h,r,.04)?1:0;
  });
  // proiettili
  for(let i=R.proj.length-1;i>=0;i--){
    const p=R.proj[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;let dead=p.life<=0;
    if(!dead){for(const s of R.solids){if(!s.alive||s===p.from)continue;if(Math.abs(p.x-s.x)<s.cw/2+.12&&p.y>s.y-.12&&p.y<s.y+s.ch+.12&&(m2||Math.abs(p.z-s.z)<s.cd/2+.12)){dead=true;puff(p.x,p.y,p.z,p.color,5);break}}}
    if(!dead){for(const r of R.actors){if(!r.alive||r===p.from||r.a.tag!=='nemico')continue;
      if(Math.abs(p.x-r.x)<r.cw/2+.15&&p.y>r.y-.15&&p.y<r.y+r.ch+.15&&(m2||Math.abs(p.z-r.z)<r.cd/2+.15)){r.alive=false;r.visible=false;R.hits[p.node]=1;dead=true;sfx('boom');puff(r.x,r.y+r.ch/2,r.z,'#FF6B5A',14);break}}}
    if(dead)R.proj.splice(i,1);
  }
  // fine tick: azzera gli impulsi
  R.actors.forEach(r=>{r.clickPulse=0});RN.mouse.hit=false;
  if(R.goto){const id=R.goto;R.goto='';RN.sceneId=id;initScene(id);RN.state='play';RN.mouse.on=false}
}
function winGame(){if(RN.state!=='play')return;RN.state='win';sfx('vittoria');showOv('win');confetti()}
function loseGame(){if(RN.state!=='play')return;RN.state='lose';sfx('colpo');showOv('lose')}
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cols=['#FF6B5A','#FFD23F','#14C8A0','#3B82F6','#8B5CF6'],H=stage.clientHeight+30;
  for(let i=0;i<40;i++){const c=el('div','confetti');c.style.left=Math.random()*100+'%';c.style.background=cols[i%5];c.style.setProperty('--h',H+'px');c.style.setProperty('--r',(Math.random()*900-300)+'deg');c.style.animationDuration=(1.6+Math.random()*1.6)+'s';c.style.animationDelay=Math.random()*.6+'s';stage.appendChild(c);setTimeout(()=>c.remove(),4200)}
}
function frame(ts){
  if(!RN.active)return;RN.raf=requestAnimationFrame(frame);
  const dt=Math.min(.05,(ts-RN.last)/1000||0);RN.last=ts;RN.t+=dt;
  pollPad();
  const R=RN.R;if(!R)return;
  if(RN.state==='play'){RN.acc+=dt;while(RN.acc>=1/60){step(1/60);RN.acc-=1/60;if(RN.state!=='play'||RN.R!==R){RN.acc=0;break}}}
  const R2=RN.R;
  for(let i=RN.parts.length-1;i>=0;i--){const p=RN.parts[i];p.l-=dt;if(p.l<=0){RN.parts.splice(i,1);continue}p.vy-=14*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt}
  R2.actors.forEach(r=>{if(r.a.kind==='ui'){const e=R2.ui[r.a.id];if(!e)return;e.style.display=r.visible&&r.alive?'':'none';

  $$('#tabs .tab').forEach(t=>t.setAttribute('aria-selected',String(t.dataset.view===v)));

/* ================= Salvataggio, esportazione, importazione ================= */
function cloneP(p){return JSON.parse(JSON.stringify(p))}
function saveMine(){
  if(FOREIGN){toast('Errore: non è un tuo gioco.','err');return}
  const list=store.get('cc_mine',[]),i=list.findIndex(x=>x.id===P.id),copy=cloneP(P);
  if(i>=0)list[i]=copy;else list.push(copy);
  let keep=list.slice(-12),ok=store.set('cc_mine',keep);
  while(!ok&&keep.length>1){keep=keep.slice(1);ok=store.set('cc_mine',keep)}
  if(ok&&store.get('cc_mine',[]).some(x=>x.id===P.id))toast('Salvato nei tuoi giochi.','ok');
  else toast('Errore: il gioco è troppo grande per il salvataggio del browser. Usa Esporta file.','err');
}
async function exportProject(){
  const data=JSON.stringify(P),fn=(P.title||'gioco').replace(/[^\w\-]+/g,'_').slice(0,40)+'.json';
  let dl=null;try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){}
  if(!dl){toast('Errore: in questo momento non posso scaricare file da qui.','err');return}
  try{await dl.save({filename:fn,data});toast('File pronto.','ok')}
  catch(e){if(e&&e.code!=='declined')toast('Errore: non sono riuscito a salvare il file ('+(e.code||'sconosciuto')+').','err')}

function importProject(){

  inp.addEventListener('change',()=>{
    const f=inp.files[0];if(!f)return;
    if(f.size>25e6){toast('Errore: il file è troppo grande (oltre 25 MB).','err');return}
    const r=new FileReader();r.onload=()=>{
      let p=null;try{p=sanitize(JSON.parse(r.result))}catch(e){}
      if(!p){dialog({title:'File non valido',text:'Questo file non è un gioco di Cavi e Cubi: non contiene scene leggibili. Si importano solo i file .json esportati da qui.'});return}

function drawMini(cv,p){
  const W=192,H=108;cv.width=W;cv.height=H;const c=cv.getContext('2d');
  const S=p.scenes.find(s=>s.id===p.start)||p.scenes[0];
  const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,S.bg[0]);g.addColorStop(1,S.bg[1]);c.fillStyle=g;c.fillRect(0,0,W,H);
  const act=S.actors.filter(a=>a.kind!=='ui'&&a.kind!=='zone'&&a.kind!=='text');
  if(!act.length)return;
  const hero=act.find(a=>a.player)||act[0];
  let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;
  const px=a=>S.mode==='3d'?a.x+a.z*.5:a.x,py=a=>S.mode==='3d'?a.y+a.z*.35:a.y;
  act.forEach(a=>{x0=Math.min(x0,px(a)-a.w/2);x1=Math.max(x1,px(a)+a.w/2);y0=Math.min(y0,py(a));y1=Math.max(y1,py(a)+a.h)});
  const pad=1;x0-=pad;x1+=pad;y0-=pad;y1+=pad;const k=Math.min(W/(x1-x0),H/(y1-y0));
  const ox=(W-(x1-x0)*k)/2,oy=(H-(y1-y0)*k)/2;
  c.lineWidth=1.5;c.strokeStyle=INK;
  act.forEach(a=>{
    const X=ox+(px(a)-a.w/2-x0)*k,Y=H-oy-(py(a)+a.h-y0)*k,w=a.w*k,h=a.h*k;
    if(a.kind==='sprite'){const sp=spriteById(a.ref);if(sp){const im=img(sp.anims[0].frames[0]);if(im.complete&&im.naturalWidth){c.imageSmoothingEnabled=false;c.drawImage(im,X,Y,w,h);return}}}
    c.fillStyle=a.color||'#999';if(a.shape==='sphere'){c.beginPath();c.ellipse(X+w/2,Y+h/2,w/2,h/2,0,0,6.3);c.fill();c.stroke()}
    else{c.fillRect(X,Y,w,h);c.strokeRect(X,Y,w,h)}
  });
  if(hero&&hero.player){c.strokeStyle='#fff';c.lineWidth=2;const X=ox+(px(hero)-hero.w/2-x0)*k,Y=H-oy-(py(hero)+hero.h-y0)*k;c.strokeRect(X-2,Y-2,hero.w*k+4,hero.h*k+4)}
}
function thumbURL(p){const cv=document.createElement('canvas');drawMini(cv,p);try{return cv.toDataURL('image/jpeg',.55)}catch(e){return''}}

const Online={db:null,user:null,uid:null,status:'loading',games:[],likes:new Map()};
const MAXJSON=240000;

async function publish(){
  if(FOREIGN)return;
  const errs=issueRows();
  if(errs.length){let close=null;const rows=errs.map(e=>e.ref?e:{name:'',text:e.msg,msg:e.msg});
    const body=issuesBody(rows,()=>close&&close());close=dialog({title:'Non si può ancora pubblicare',text:'Ci sono errori di compatibilità da sistemare.',body});return}
  if(!Online.db||!Online.uid){
    dialog({title:'Galleria non disponibile',text:'Per pubblicare apri la pagina da claude.ai con un account che può scrivere nella galleria. Intanto puoi salvare il gioco nei tuoi giochi.',actions:[{label:'Salva nei miei giochi',kind:'primary',run:saveMine},{label:'Chiudi'}]});return;
  }
  const json=JSON.stringify(P);
  if(json.length>MAXJSON){dialog({title:'Il gioco è troppo grande per la galleria',text:'Il gioco pesa '+kb(json.length)+' e il limite è '+kb(MAXJSON)+'. Di solito pesano i modelli 3D importati o i disegni grandi con molti fotogrammi.',list:sizeBreakdown(),actions:[{label:'Esporta file',run:exportProject},{label:'Chiudi'}]});return}
  try{
    const iref=Online.db.doc('index/'+Online.uid),snap=await iref.get(),list=(snap.exists&&snap.data()&&Array.isArray(snap.data().games))?snap.data().games.slice():[];
    const entry={id:P.id,title:P.title,mode:P.scenes.some(s=>s.mode==='3d')?'3d':'2d',at:Date.now(),platforms:P.settings.platforms.slice(),minv:Object.assign({},P.settings.minv||{}),inputs:P.settings.inputs.slice(),scenes:P.scenes.length,thumb:thumbURL(P)};
    const i=list.findIndex(x=>x&&x.id===entry.id);
    if(i>=0)list[i]=entry;else{
      if(list.length>=8){dialog({title:'Troppi giochi pubblicati',text:'Puoi tenere online 8 giochi. Ritira uno dalla galleria e riprova.'});return}
      list.push(entry);
    }
    await Online.db.doc('games2/'+Online.uid+'/items/'+P.id).set({json});
    await iref.set({games:list});
    toast('Pubblicato. Ora tutti lo vedono nella galleria.','ok');Gal.tab='online';setView('gallery');
  }catch(e){
    const c=e&&e.code;
    dialog({title:'Pubblicazione non riuscita',text:c==='quota_exceeded'?'La galleria è piena. Riprova più tardi.':c==='invalid_argument'?'Non hai il permesso di scrivere nella galleria, oppure il gioco è troppo grande.':'Non sono riuscito a raggiungere la galleria. Riprova tra poco.'});
  }

async function initOnline(){
  let tries=0;
  while(!(window.claude&&window.claude.use)&&tries<15){await new Promise(r=>setTimeout(r,200));tries++}
  if(!(window.claude&&window.claude.use)){Online.status='off';galRefresh();return}
  try{
    const res=await Promise.all([withTimeout(window.claude.use('db'),10000),withTimeout(window.claude.use('user'),10000)]);
    Online.db=res[0];Online.user=res[1];
    if(Online.user){try{Online.uid=await Online.user.id()}catch(e){}}
    if(!Online.db){Online.status='off';galRefresh();return}
    const timer=setTimeout(()=>{if(Online.status==='loading'){Online.status='slow';galRefresh()}},10000);
    Online.db.collection('index').onSnapshot(snap=>{
      clearTimeout(timer);const list=[];
      snap.docs.forEach(d=>{const data=d.data()||{};(Array.isArray(data.games)?data.games:[]).slice(0,8).forEach(g=>{
        if(!g||!g.id||!g.title)return;list.push({key:d.id+':'+g.id,id:String(g.id),authorId:d.id,meta:g,at:Number(g.at)||0});
      })});
      list.sort((a,b)=>b.at-a.at);Online.games=list;Online.status='ready';galRefresh();
    },()=>{clearTimeout(timer);Online.status='error';galRefresh()});
    Online.db.collection('likes').onSnapshot(snap=>{
      const m=new Map();
      snap.docs.forEach(d=>{const ids=(d.data()||{}).ids;if(Array.isArray(ids))ids.forEach(k=>{if(typeof k!=='string')return;if(!m.has(k))m.set(k,new Set());m.get(k).add(d.id)})});
      Online.likes=m;galRefresh();
    },()=>{});
  }catch(e){Online.status='off';galRefresh()}
}
const Gal={tab:'online'};
function galItems(){
  if(Gal.tab==='examples')return examples().map(x=>({key:'ex:'+x.p.id,p:x.p,author:'Squadra Cavi e Cubi',tag:x.genre}));
  if(Gal.tab==='mine')return store.get('cc_mine',[]).map(g=>{const p=sanitize(g);return p?{key:'mine:'+p.id,p,mine:true}:null}).filter(Boolean);
  return Online.games;
}
function galStatusText(){
  if(Gal.tab==='examples')return'Sei giochi di generi diversi: prova a giocarci, poi premi Modifica copia per vedere come sono fatti i cavi.';
  if(Gal.tab==='mine')return galItems().length?'Sono salvati su questo dispositivo.':'Non hai ancora salvato giochi. Nella scheda Gioco premi Salva nei miei giochi.';
  const s=Online.status;
  if(s==='off')return'La galleria online non è disponibile qui. Aprila da claude.ai con il tuo account per pubblicare e giocare ai giochi degli altri. Intanto trovi gli esempi e i tuoi giochi.';
  if(s==='loading')return'Cerco i giochi della community...';
  if(s==='slow')return'La connessione è lenta: l\'elenco potrebbe non essere aggiornato.';
  if(s==='error')return'Non riesco a leggere la galleria in questo momento. Riprova più tardi.';
  return Online.games.length?'Giochi pubblicati dalla community. Scegli e gioca.':'Ancora nessun gioco pubblicato. Il primo può essere il tuo.';
}
let galT=0;
function galRefresh(){clearTimeout(galT);galT=setTimeout(()=>{if(!$('#v-gallery').hidden)renderGallery()},120)}
function modeOf(p){return p.scenes.some(s=>s.mode==='3d')?'3d':'2d'}
function galCard(item,idx){
  const a=el('article','gcard');a.style.animationDelay=Math.min(idx,8)*40+'ms';
  const title=item.p?item.p.title:item.meta.title,mode=item.p?modeOf(item.p):(item.meta.mode==='3d'?'3d':'2d'),plats=item.p?item.p.settings.platforms:(item.meta.platforms||[]);
  if(item.p){const cv=document.createElement('canvas');cv.className='th';cv.setAttribute('aria-hidden','true');a.appendChild(cv);drawMini(cv,item.p);
    // i disegni si caricano dopo: ridisegna
    setTimeout(()=>{try{drawMini(cv,item.p)}catch(e){}},300)}
  else{const im=document.createElement('img');im.className='th';im.alt='';if(/^data:image\//.test(item.meta.thumb||''))im.src=item.meta.thumb;a.appendChild(im)}
  a.appendChild(el('h3',null,String(title).slice(0,40)));
  const meta=el('div','gmeta');meta.appendChild(el('span','tag '+(mode==='3d'?'m3':'m2'),mode.toUpperCase()));
  if(item.tag)meta.appendChild(el('span','tag ex',item.tag));
  const mv=item.p?(item.p.settings.minv||{}):(item.meta.minv||{});plats.forEach(p=>{const d=devOf(p);const v=Number(mv[p])||d.def||0;meta.appendChild(el('span','tag',d.short+(d.ver&&v?' '+v+'+':'')))});a.appendChild(meta);
  if(item.author)a.appendChild(el('p','gauthor','Di '+item.author));
  if(item.authorId){const p=el('p','gauthor','Di un creatore');p.dataset.aid=item.authorId;a.appendChild(p)}
  const act=el('div','gact');
  const get=async()=>{if(item.p)return cloneP(item.p);return await fetchOnline(item)};
  const play=el('button','btn primary sm','Gioca');play.addEventListener('click',async()=>{const p=await get();if(p)startRun('gallery',p)});act.appendChild(play);
  const edit=el('button','btn sm',item.mine?'Modifica':'Modifica copia');
  edit.addEventListener('click',async()=>{
    const c=await get();if(!c)return;if(!item.mine){c.id=uid();c.title=(c.title+' (copia)').slice(0,40)}
    setProject(c);save();setView('scene');toast(item.mine?'Gioco aperto nell\'editor.':'Copia aperta nell\'editor.','ok');
  });act.appendChild(edit);
  if(item.mine){const del=el('button','btn sm','Elimina');del.addEventListener('click',()=>{store.set('cc_mine',store.get('cc_mine',[]).filter(x=>x.id!==item.p.id));renderGallery()});act.appendChild(del)}
  if(item.authorId){
    const n=(Online.likes.get(item.key)||new Set()).size,mine=Online.uid&&(Online.likes.get(item.key)||new Set()).has(Online.uid);
    const lk=el('button','btn sm'+(mine?' sun':''),'Mi piace '+n);lk.setAttribute('aria-pressed',String(!!mine));lk.addEventListener('click',()=>toggleLike(item.key));act.appendChild(lk);
    if(Online.uid&&item.authorId===Online.uid){const r=el('button','btn sm','Ritira');r.addEventListener('click',()=>retire(item.key));act.appendChild(r)}
  }
  a.appendChild(act);return a;
}
function renderGallery(){
  $$('#galTabs button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.g===Gal.tab)));
  $('#galStatus').textContent=galStatusText();
  const grid=$('#galGrid');grid.textContent='';const items=galItems();
  if(!items.length&&(Gal.tab!=='online'||Online.status==='ready'))grid.appendChild(el('div','empty',Gal.tab==='mine'?'Qui compariranno i giochi che salvi.':'Nessun gioco da mostrare.'));
  items.forEach((it,i)=>grid.appendChild(galCard(it,i)));fillAuthors();
}
async function fillAuthors(){
  const nodes=$$('#galGrid [data-aid]');if(!nodes.length||!Online.user)return;
  try{
    const ps=await Online.user.profiles(Array.from(new Set(nodes.map(n=>n.dataset.aid))));
    nodes.forEach(n=>{const p=ps[n.dataset.aid];n.textContent='Di '+((p&&p.name)||'un creatore')+(p&&p.isMe?' (tu)':'')});
  }catch(e){}
}
$$('#galTabs button').forEach(b=>b.addEventListener('click',()=>{Gal.tab=b.dataset.g;renderGallery()}));
$('#btnPubGal').addEventListener('click',publish);

/* ================= Tutorial ================= */
const TUT=[
  {t:'Benvenuto in Cavi e Cubi',b:'Qui costruisci giochi 2D e 3D collegando nodi con dei cavi. Ti faccio fare un giro: ci vuole un minuto.',view:'scene'},
  {t:'La libreria',b:'Qui ci sono forme, zone invisibili, testi, elementi HTML, i tuoi disegni e i tuoi modelli 3D. Scegline uno: se ha una X rossa, il motivo compare nel suggerimento.',view:'scene',target:'[data-tut="lib"]'},
  {t:'La scena',b:'Clicca sulla scena per piazzare l\'oggetto scelto. Seleziona un oggetto per spostarlo o ridimensionarlo. La barra sopra gestisce le scene, annulla e ripeti.',view:'scene',target:'[data-tut="vp"]'},
  {t:'Cambiare tutto',b:'Con un oggetto scelto, qui cambi misure, colore, se è solido, se è l\'eroe 1P e il suo comportamento: moneta, pericolo, traguardo o porta verso un\'altra scena.',view:'scene',target:'[data-tut="insp"]'},
  {t:'I nodi',b:'Qui sta la logica. Stick, Pulsante, Tasto, Cronometro, Lancia-oggetti, Suono, Numero, Non e gli altri si trascinano nello schema.',view:'nodes',target:'[data-tut="ndpal"]'},
  {t:'I cavi',b:'Trascina da un\'uscita (a destra di un nodo) a un ingresso (a sinistra di un altro) per fare un cavo. Per esempio: Stick x → Eroe muovi X.',view:'nodes',target:'[data-tut="graph"]'},
  {t:'Disegna personaggi',b:'Un editor di pixel art con secchio, forme, selezione, copia e incolla, animazioni fotogramma per fotogramma. Puoi salvare un disegno nella galleria oggetti e usarlo come timbro in altri disegni. L\'eroe 1P può essere un disegno.',view:'draw',target:'[data-tut="dcv"]'},
  {t:'Modelli 3D',b:'Costruisci modelli con le forme oppure importa un file 3D. Se il formato non è supportato, ti spiego perché.',view:'models',target:'[data-view="models"]'},
  {t:'Musica ed effetti',b:'Crea canzoncine con la griglia a note oppure importa un MP3 (o WAV, OGG, M4A, FLAC). Fai anche effetti sonori tuoi. Una canzone parte all\'inizio, in una scena, o quando vuoi con il nodo Musica.',view:'music',target:'[data-view="music"]'},
  {t:'Dove si gioca',b:'Scegli uno o più dispositivi (iPhone, iPad, Android, console, Windows, Mac, Linux) e la versione più vecchia che vuoi supportare. Se un oggetto non va bene per uno di loro, sotto compare il suo nome, un pulsante Seleziona e il motivo.',view:'game',target:'[data-tut="plat"]'},
  {t:'I suoni del sito',b:'Qui regoli la canzoncina e gli effetti del sito, o li spegni. Quando provi un gioco si fermano da soli.',view:'game',target:'#btnSound'},
  {t:'La barra comandi',b:'Premi / oppure clicca qui: puoi scrivere comandi come "aggiungi blocco 3 0", "imposta colore rosso", "cursore nascondi" o "collega stick1.x eroe.mx". Scrivi aiuto per l\'elenco.',view:'game',target:'[data-tut="cmd"]'},
  {t:'Prova e pubblica',b:'Prova avvia il gioco, anche come se fosse su iPhone, Android o console. Nella Galleria trovi sei esempi di generi diversi e i giochi degli altri.',view:'game',target:'#btnPlay'},
  {t:'Pronto',b:'Ora tocca a te. Puoi rivedere il tutorial dal pulsante in alto.',view:'game'}
];
const Tut={i:-1,spot:null,card:null};
function tutStart(){
  if(RN.active){const f=RN.from;stopRun()}
  Tut.i=0;window.addEventListener('resize',tutPos);window.addEventListener('scroll',tutPos,true);tutShow();
}
function tutEnd(){
  Tut.i=-1;$('#tutRoot').textContent='';window.removeEventListener('resize',tutPos);window.removeEventListener('scroll',tutPos,true);store.set('cc_seen',1);
}
function tutShow(){
  const st=TUT[Tut.i],root=$('#tutRoot');root.textContent='';
  if(st.view&&UI.view!==st.view)setView(st.view);
  const spot=el('div','tut-spot'),card=el('div','tut-card');card.setAttribute('role','dialog');card.setAttribute('aria-label','Tutorial');
  card.appendChild(el('h3',null,st.t));card.appendChild(el('p',null,st.b));
  const row=el('div','row'),dots=el('div','dots');TUT.forEach((x,i)=>dots.appendChild(el('i',i===Tut.i?'on':'')));
  const nav=el('div');nav.style.cssText='display:flex;gap:6px';
  if(Tut.i>0){const p=el('button','btn sm','Indietro');p.addEventListener('click',()=>{Tut.i--;tutShow()});nav.appendChild(p)}
  const last=Tut.i===TUT.length-1,n=el('button','btn primary sm',last?'Fine':'Avanti');
  n.addEventListener('click',()=>{if(last)tutEnd();else{Tut.i++;tutShow()}});nav.appendChild(n);
  if(!last){const s=el('button','btn sm','Salta');s.addEventListener('click',tutEnd);nav.insertBefore(s,nav.firstChild)}
  row.append(dots,nav);card.appendChild(row);root.append(spot,card);Tut.spot=spot;Tut.card=card;
  setTimeout(tutPos,80);tutPos();n.focus({preventScroll:true});
}
function tutPos(){
  if(Tut.i<0||!Tut.card)return;
  const st=TUT[Tut.i],card=Tut.card,spot=Tut.spot,t=st.target?$(st.target):null;
  const vw=window.innerWidth,vh=window.innerHeight,cw=card.offsetWidth,ch=card.offsetHeight;let left,top;
  if(t&&t.offsetParent!==null){
    const r=t.getBoundingClientRect(),pad=6;
    spot.style.display='block';spot.style.left=r.left-pad+'px';spot.style.top=r.top-pad+'px';spot.style.width=r.width+pad*2+'px';spot.style.height=r.height+pad*2+'px';
    if(vw<700){left=(vw-cw)/2;top=r.top+r.height/2>vh/2?16:vh-ch-16}
    else if(r.right+16+cw<vw){left=r.right+16;top=clamp(r.top,16,Math.max(16,vh-ch-16))}
    else if(r.left-16-cw>0){left=r.left-16-cw;top=clamp(r.top,16,Math.max(16,vh-ch-16))}
    else{top=r.bottom+14+ch<vh?r.bottom+14:Math.max(16,r.top-ch-14);left=clamp(r.left,16,Math.max(16,vw-cw-16))}
  }else{spot.style.display='none';left=(vw-cw)/2;top=(vh-ch)/2}
  card.style.left=Math.round(left)+'px';card.style.top=Math.round(top)+'px';
}
$('#btnTutorial').addEventListener('click',tutStart);

(function boot(){
  applyTheme(themePref);
  let p=null;try{p=sanitize(store.get('cc_proj',null))}catch(e){}
  if(!p){try{p=sanitize(JSON.parse(JSON.stringify(starterProject())))}catch(e){console.error(e)}}
  setProject(p);
  setView('scene');
  requestAnimationFrame(editorLoop);
  initOnline();
  if(!store.get('cc_seen',0)){
    setTimeout(()=>{
      if(Tut.i>=0)return;
      dialog({title:'Benvenuto in Cavi e Cubi',text:'Costruisci giochi 2D e 3D con nodi e cavi, disegna i personaggi, importa modelli 3D e pubblica nella galleria. Vuoi un giro guidato?',
        actions:[{label:'No, grazie',run:()=>store.set('cc_seen',1)},{label:'Inizia il tutorial',kind:'primary',run:tutStart}]});
    },700);
  }
})();
})();
